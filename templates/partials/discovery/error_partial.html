<div class="discovery-card" id="error-card" style="border-color: rgba(244, 63, 94, 0.4);">
    <div style="display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3);">
        <span style="font-size: 1.5rem;" aria-hidden="true">⚠️</span>
        <h2 class="discovery-title" style="font-size: 1.35rem; color: #fda4af; margin-bottom: 0;">
            Action Could Not Be Completed
        </h2>
    </div>

    <div style="background: rgba(244, 63, 94, 0.08); border-left: 4px solid var(--color-accent-rose); padding: var(--space-4); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin-bottom: var(--space-6);">
        <p style="font-size: 0.95rem; color: #ffe4e6; line-height: 1.5;">
            {{ error_message|default("A validation error occurred. Please verify your input and try again.") }}
        </p>
        {% if error_code %}
        <p style="font-family: var(--font-mono); font-size: 0.775rem; color: #f43f5e; margin-top: var(--space-2);">
            Code: {{ error_code }}
        </p>
        {% endif %}
    </div>

    <div class="btn-row">
        <button type="button" 
                class="btn btn-secondary" 
                hx-post="/discovery/backtrack" 
                hx-vals='{"target_stage": "{{ retry_stage|default('problem') }}"}'
                hx-target="#discovery-viewport" 
                hx-swap="innerHTML transition:true">
            &larr; Return to Previous Step
        </button>
        <button type="button" 
                class="btn btn-primary"
                onclick="window.location.reload()">
            <span>Reload Discovery Session</span>
        </button>
    </div>
</div>
