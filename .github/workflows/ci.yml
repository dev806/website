name: CI Quality & Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# CI uses GitHub Actions within applicable platform usage limits.
jobs:
  test:
    name: Test & Verify against SQL Server 2022
    runs-on: ubuntu-latest

    # Real Microsoft SQL Server 2022 Linux Container (Zero Dialect Substitution)
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourStrong!Password123"
          MSSQL_PID: "Express"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Password123' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Password123' -Q 'SELECT 1' || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Microsoft ODBC Driver 18 for SQL Server
        run: |
          set -e
          sudo rm -f /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: SQL Server Connection & Readiness Probe
        run: |
          python - << 'EOF'
          import time, pyodbc, sys

          conn_str = "Driver={ODBC Driver 18 for SQL Server};Server=127.0.0.1;UID=sa;PWD=YourStrong!Password123;TrustServerCertificate=yes;"
          max_attempts = 30
          print("Initiating live SQL Server readiness probe...")
          for attempt in range(1, max_attempts + 1):
              try:
                  conn = pyodbc.connect(conn_str, timeout=3)
                  cursor = conn.cursor()
                  cursor.execute("SELECT @@VERSION")
                  row = cursor.fetchone()
                  print(f"SQL Server verified ready on attempt {attempt}: {row[0].splitlines()[0]}")
                  conn.close()
                  sys.exit(0)
              except Exception as exc:
                  print(f"Attempt {attempt}/{max_attempts}: Waiting for SQL Server... ({exc})")
                  time.sleep(2)
          print("ERROR: SQL Server failed to become ready within the allocated timeout.")
          sys.exit(1)
          EOF

      - name: Provision CI Test Databases (StudioWebsiteDev & StudioWebsiteTest)
        run: |
          python - << 'EOF'
          import pyodbc

          conn_str = "Driver={ODBC Driver 18 for SQL Server};Server=127.0.0.1;UID=sa;PWD=YourStrong!Password123;TrustServerCertificate=yes;"
          conn = pyodbc.connect(conn_str, autocommit=True)
          cursor = conn.cursor()
          cursor.execute("IF DB_ID('StudioWebsiteDev') IS NULL CREATE DATABASE StudioWebsiteDev;")
          cursor.execute("IF DB_ID('StudioWebsiteTest') IS NULL CREATE DATABASE StudioWebsiteTest;")
          print("Databases StudioWebsiteDev and StudioWebsiteTest successfully provisioned.")
          conn.close()
          EOF

      - name: Execute Alembic Migrations Against Real SQL Server
        env:
          DATABASE_URL: "mssql+pyodbc://sa:YourStrong!Password123@127.0.0.1:1433/StudioWebsiteTest?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
        run: |
          echo "Running migrations on StudioWebsiteTest..."
          alembic upgrade head
          REVISION=$(alembic current)
          echo "Current revision on StudioWebsiteTest: $REVISION"
          if [[ "$REVISION" != *"4941998763bd"* ]]; then
            echo "ERROR: Expected revision 4941998763bd, got: $REVISION"
            exit 1
          fi

          echo "Running migrations on StudioWebsiteDev..."
          DATABASE_URL="mssql+pyodbc://sa:YourStrong!Password123@127.0.0.1:1433/StudioWebsiteDev?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes" alembic upgrade head

      - name: Execute Main Application Test Suite (85 Tests)
        env:
          PYTHONPATH: .
          APP_ENV: testing
          DATABASE_URL: "mssql+pyodbc://sa:YourStrong!Password123@127.0.0.1:1433/StudioWebsiteTest?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
          DATABASE_URL_DEV: "mssql+pyodbc://sa:YourStrong!Password123@127.0.0.1:1433/StudioWebsiteDev?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
          DATABASE_URL_TEST: "mssql+pyodbc://sa:YourStrong!Password123@127.0.0.1:1433/StudioWebsiteTest?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
          SECRET_KEY: "ci-insecure-test-secret-key-must-be-min-32-chars-long"
        run: |
          pytest tests/ -v

      - name: Execute Sprint 0 Baseline Regression Suite (7 Tests)
        env:
          PYTHONPATH: .
          APP_ENV: testing
          DATABASE_URL: "mssql+pyodbc://sa:YourStrong!Password123@127.0.0.1:1433/StudioWebsiteTest?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
          DATABASE_URL_DEV: "mssql+pyodbc://sa:YourStrong!Password123@127.0.0.1:1433/StudioWebsiteDev?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
          DATABASE_URL_TEST: "mssql+pyodbc://sa:YourStrong!Password123@127.0.0.1:1433/StudioWebsiteTest?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
          SECRET_KEY: "ci-insecure-test-secret-key-must-be-min-32-chars-long"
        run: |
          pytest spikes/test_sprint0_suite.py -v

      - name: Install Static Analysis Tooling
        run: |
          pip install ruff bandit pip-audit

      - name: Execute Code Quality Analysis (Ruff)
        run: |
          ruff check .

      - name: Execute Security Static Analysis (Bandit)
        run: |
          bandit -r app/

      - name: Execute Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit -r requirements.txt

      - name: Diagnostic Output on Failure
        if: failure()
        run: |
          echo "=== CI FAILURE DIAGNOSTICS ==="
          echo "--- Docker Process Listing ---"
          docker ps -a || true
          echo "--- SQL Server Container Logs (tail 100) ---"
          CONTAINER_ID=$(docker ps -a -q --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest | head -n 1)
          if [ -n "$CONTAINER_ID" ]; then
            docker logs --tail 100 "$CONTAINER_ID" || true
          fi
